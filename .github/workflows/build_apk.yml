
name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize Android Platform Files
        run: |
          flutter create --org com.gurukrupa --project-name gurukrupa_quotation --platforms=android .
          git checkout -- pubspec.yaml lib/main.dart

      - name: Get Dependencies & Build Release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gurukrupa-Quotation-App
          path: build/app/outputs/flutter-apk/app-release.apk

          
